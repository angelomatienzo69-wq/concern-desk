<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concern Desk — Student Concern Tracking</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--ink:#1f2a2e;--mut:#6b7479;--line:#ddd5c5;--acc:#0f5c4d;--acc2:#e0a526;--bad:#b3392b}
@media(prefers-color-scheme:dark){:root{--bg:#161b1d;--card:#1f2629;--ink:#ece8df;--mut:#9aa4a8;--line:#333d41;--acc:#4fb89f;--acc2:#e0a526;--bad:#ef7a6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Public Sans',system-ui,sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;margin:0 0 .5rem}h2{font-size:1.7rem}
header{display:flex;align-items:center;gap:1rem;padding:.8rem 1.2rem;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{font:700 1.3rem Newsreader,serif;margin-right:auto}nav{display:flex;gap:.3rem;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.4rem .8rem;border-radius:6px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}button.on{border-color:var(--acc);color:var(--acc);font-weight:600}button.d{color:var(--bad)}
main{max-width:1050px;margin:1.2rem auto;padding:0 1rem}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:1rem}
input,select,textarea{font:inherit;width:100%;padding:.45rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
label{display:block;font-weight:600;margin:.6rem 0 .2rem}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:.85rem}
tr.k{cursor:pointer}tr.k:hover{background:var(--bg)}.tag{padding:.1rem .5rem;border-radius:99px;font-size:.78rem;border:1px solid var(--line);white-space:nowrap}
.s-Submitted{background:#e8e2d0;color:#4a4020}.s-Under\ Review{background:#d9e6f2;color:#1d4466}.s-In\ Progress{background:#f6e3b4;color:#6b4a00}.s-Resolved,.s-Closed{background:#cfe9dc;color:#0f5c4d}.s-Rejected,.s-Cancelled{background:#f3d1cb;color:#8a2a1e}
.od{color:var(--bad);font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}.stat b{font:700 2rem Newsreader,serif;display:block}
.bar{display:flex;align-items:center;gap:.5rem;margin:.25rem 0}.bar i{display:block;height:14px;background:var(--acc);border-radius:3px}.bar span{min-width:110px;color:var(--mut)}
.err{color:var(--bad);margin:.5rem 0;min-height:1.2em}.log{border-left:3px solid var(--acc2);padding:.2rem .8rem;margin:.5rem 0}.mut{color:var(--mut);font-size:.88rem}
#bell{position:relative}#bell em{background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:0 .35rem;font-style:normal;margin-left:.3rem}
.login{max-width:380px;margin:4rem auto}
.logo{display:inline-flex;align-items:center;gap:.5rem;margin-right:auto}.logo svg{width:30px;height:30px}.logo b{margin:0}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:2rem;max-width:960px;margin:3rem auto;align-items:center}
.hero h1{font-size:2.6rem;line-height:1.1;margin-bottom:.8rem}.hero p{color:var(--mut);max-width:34ch}.hero svg{width:100%;max-width:440px;margin-top:1rem}
.split .login{margin:0}@media(max-width:760px){.split{grid-template-columns:1fr;margin:1rem auto}.hero h1{font-size:2rem}}
.track{display:flex;align-items:flex-start;margin:.4rem 0 1.2rem}.track div{flex:1;text-align:center;position:relative;font-size:.8rem;color:var(--mut)}
.track div:before{content:"";display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--card);margin:0 auto .3rem;position:relative;z-index:1}
.track div:after{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--line)}.track div:first-child:after{display:none}
.track .done{color:var(--ink)}.track .done:before{background:var(--acc);border-color:var(--acc)}.track .done:after{background:var(--acc)}
.track .now:before{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc2) 40%,transparent);border-color:var(--acc2);background:var(--acc2)}.track .now{font-weight:600;color:var(--ink)}
.end{padding:.5rem .8rem;border-radius:6px;margin-bottom:1rem}.empty{text-align:center;padding:2rem;color:var(--mut)}.att{display:flex;gap:.8rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--line)}.att img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}.att .doc{font-size:2rem;width:64px;text-align:center}.att>div{flex:1}</style></head><body>
<header id="hd"></header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,meta,view='dash',F={q:'',status:'',sort:'newest',overdue:''};
const api=async(u,o)=>{const r=await fetch('/api'+u,o&&{method:o.m,headers:{'Content-Type':'application/json'},body:JSON.stringify(o.b)});const d=await r.json();if(!r.ok)throw Error(d.error);return d};
const post=(u,b)=>api(u,{m:'POST',b});const tag=s=>`<span class="tag s-${s}">${s}</span>`;
async function boot(){me=await api('/me');if(!me)return loginView();meta=await api('/meta');go('dash')}
function loginView(reg){$('#hd').innerHTML='<span class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="26" height="20" rx="4" fill="var(--acc)" stroke="none"/><path d="M9 11h14M9 16h8" stroke="#fff"/><path d="M11 24l-3 5 8-5" fill="var(--acc)" stroke="none"/><circle cx="24" cy="21" r="5" fill="var(--acc2)" stroke="none"/><path d="M21.8 21l1.5 1.5 2.7-3" stroke="#1f2a2e" stroke-width="1.8"/></svg><b>Concern Desk</b></span>';$('#app').innerHTML=`<div class="split"><div class="hero"><h1>Every concern finds its desk.</h1><p>Report an issue once. We route it to the right office, track every step, and tell you when it is resolved.</p><svg viewBox="0 0 440 150" fill="none"><path d="M40 100 C120 100 120 40 200 40 S300 100 400 60" stroke="var(--line)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="40" cy="100" r="16" fill="var(--acc2)"/><circle cx="200" cy="40" r="16" fill="var(--acc)"/><circle cx="400" cy="60" r="16" fill="var(--acc)"/><path d="M393 60l5 5 9-10" stroke="#fff" stroke-width="3" stroke-linecap="round"/><g fill="var(--ink)" font-size="13" font-family="Public Sans,sans-serif" text-anchor="middle"><text x="40" y="135">Student</text><text x="200" y="78">Right office</text><text x="400" y="98">Resolved</text></g></svg></div><div class="card login"><h2>${reg?'Create student account':'Sign in'}</h2>
${reg?'<label>Full name</label><input id="n">':''}<label>Email</label><input id="e" type="email"><label>Password</label><input id="p" type="password">
<div class="err" id="er"></div><button class="p" id="go">${reg?'Register':'Log in'}</button> <button id="sw">${reg?'Back to login':'Register as student'}</button>
${reg?'':'<p class="mut">Demo: demo.user@email.com / demo.admin@email.com<br>Staff: registrar@school.edu, affairs@, finance@, it@ (same password)</p>'}</div>`;
$('#sw').onclick=()=>loginView(!reg);$('#go').onclick=async()=>{try{if(reg){await post('/register',{full_name:$('#n').value,email:$('#e').value,password:$('#p').value})}
await post('/login',{email:$('#e').value,password:$('#p').value});boot()}catch(e){$('#er').textContent=e.message}}}
async function go(v,id){view=v;const nt=await api('/notifications'),un=nt.filter(n=>!n.is_read).length;
const tabs=[['dash','Dashboard'],['list',me.role==='student'?'My Concerns':'Concerns'],...(me.role==='student'?[['new','New Concern']]:[]),...(me.role==='admin'?[['users','Users'],['cats','Routing']]:[]),['notif','Notifications']];
$('#hd').innerHTML=`<span class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="26" height="20" rx="4" fill="var(--acc)" stroke="none"/><path d="M9 11h14M9 16h8" stroke="#fff"/><path d="M11 24l-3 5 8-5" fill="var(--acc)" stroke="none"/><circle cx="24" cy="21" r="5" fill="var(--acc2)" stroke="none"/><path d="M21.8 21l1.5 1.5 2.7-3" stroke="#1f2a2e" stroke-width="1.8"/></svg><b>Concern Desk</b></span><nav>${tabs.map(t=>`<button class="${view===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}${t[0]==='notif'&&un?`<em>${un}</em>`:''}</button>`).join('')}</nav>
<span class="mut">${E(me.full_name)} · ${me.role}${me.dept?' · '+E(me.dept):''}</span><button onclick="post('/logout').then(boot)">Log out</button>`;
({dash,list,new:newF,detail,users,cats,notif:()=>notifV(nt)})[v](id)}
async function dash(){const d=await api('/dashboard'),mx=o=>Math.max(1,...Object.values(o));
const bars=o=>Object.entries(o).map(([k,v])=>`<div class="bar"><span>${k}</span><i style="width:${v/mx(o)*60}%"></i>${v}</div>`).join('')||'<p class="mut">No data</p>';
$('#app').innerHTML=`<h2>Overview</h2><div class="grid"><div class="card stat"><b>${d.total}</b>Total concerns</div><div class="card stat"><b class="od">${d.overdue}</b>Overdue (past SLA)</div>
<div class="card stat"><b>${(d.byStatus.Submitted||0)+(d.byStatus['Under Review']||0)+(d.byStatus['In Progress']||0)}</b>Open</div><div class="card stat"><b>${(d.byStatus.Resolved||0)+(d.byStatus.Closed||0)}</b>Resolved / Closed</div></div>
<div class="grid"><div class="card"><h3>By status</h3>${bars(d.byStatus)}</div><div class="card"><h3>By priority</h3>${bars(d.byPriority)}</div>${me.role!=='student'?`<div class="card"><h3>By department</h3>${bars(d.byDept)}</div>`:''}</div>`}
async function list(){const qs=new URLSearchParams(F).toString(),rows=await api('/concerns?'+qs);
$('#app').innerHTML=`<h2>${me.role==='student'?'My concerns':'Concern queue'}</h2><div class="card"><div class="row"><div><label>Search</label><input id="fq" value="${E(F.q)}" placeholder="Subject, reference, student"></div>
<div><label>Status</label><select id="fs"><option value="">All</option>${meta.statuses.map(s=>`<option ${F.status===s?'selected':''}>${s}</option>`)}</select></div>
<div><label>Sort</label><select id="fo">${[['newest','Newest'],['oldest','Oldest'],['due','Due date'],['priority','Priority']].map(o=>`<option value="${o[0]}" ${F.sort===o[0]?'selected':''}>${o[1]}</option>`)}</select></div>
<div><label>&nbsp;</label><button onclick="F.overdue=F.overdue?'':'1';list()" class="${F.overdue?'on':''}">Overdue only</button></div>
${me.role!=='student'?'<div><label>&nbsp;</label><a class="btn" href="/api/export.csv?'+qs+'">Export CSV</a></div>':''}</div></div>
<div class="card" style="overflow:auto"><table><tr><th>Ref</th><th>Subject</th>${me.role!=='student'?'<th>Student</th>':''}<th>Department</th><th>Priority</th><th>Due</th><th>Status</th></tr>
${rows.map(r=>`<tr class="k" onclick="go('detail',${r.concern_id})"><td>${r.ref_no}</td><td>${E(r.subject)}<div class="mut">${E(r.category)}</div></td>${me.role!=='student'?`<td>${E(r.student_name)}</td>`:''}<td>${E(r.department)}<div class="mut">${E(r.assignee||'Unassigned')}</div></td><td>${r.priority}</td><td class="${r.overdue?'od':''}">${r.due_at.slice(0,10)}${r.overdue?' ⚠ overdue':''}</td><td>${tag(r.status)}</td></tr>`).join('')||'<tr><td colspan=7 class="empty">Nothing here yet. Try clearing the filters, or submit a new concern.</td></tr>'}</table></div>`;
const re=()=>{F.q=$('#fq').value;F.status=$('#fs').value;F.sort=$('#fo').value;list()};$('#fs').onchange=$('#fo').onchange=re;$('#fq').onkeydown=e=>e.key==='Enter'&&re();$('#fq').onchange=re}
function newF(c){const e=c&&c.concern_id;$('#app').innerHTML=`<h2>${e?'Edit concern':'Submit a concern'}</h2><div class="card"><label>Category (decides which office receives it)</label>
<select id="c" ${e?'disabled':''}>${meta.categories.map(x=>`<option value="${x.category_id}" ${e&&c.category_id==x.category_id?'selected':''}>${E(x.name)} → ${E(x.dept)}</option>`)}</select>
<label>Subject</label><input id="s" maxlength="120" value="${e?E(c.subject):''}"><label>Description</label><textarea id="d" rows="5">${e?E(c.description):''}</textarea>
<label>Priority (sets response deadline: Urgent 1 day, Normal 3, Low 5)</label><select id="p">${['Low','Normal','Urgent'].map(x=>`<option ${(e?c.priority:'Normal')===x?'selected':''}>${x}</option>`)}</select>
${e?'':'<label>Attach images or documents (optional) — PNG, JPG, PDF, DOC, DOCX, TXT; 2 MB each, up to 5</label><input id="f" type="file" multiple accept=".png,.jpg,.jpeg,.pdf,.doc,.docx,.txt">'}<div class="err" id="er"></div><button class="p" id="sv">${e?'Save changes':'Submit concern'}</button></div>`;
$('#sv').onclick=async()=>{try{const b={category_id:$('#c').value,subject:$('#s').value,description:$('#d').value,priority:$('#p').value};
if(e){await api('/concerns/'+c.concern_id,{m:'PUT',b});go('detail',c.concern_id)}else{const r=await post('/concerns',b);try{await upl(r.concern_id,$('#f').files)}catch(x){alert('Concern submitted, but a file failed: '+x.message)}go('detail',r.concern_id)}}catch(x){$('#er').textContent=x.message}}}
async function detail(id){const c=await api('/concerns/'+id),st=me.role==='student'?'student':'staff',
FL={Submitted:{staff:['Under Review','Rejected'],student:['Cancelled']},'Under Review':{staff:['In Progress','Rejected']},'In Progress':{staff:['Resolved']},Resolved:{student:['Closed','In Progress']}},acts=(FL[c.status]||{})[st]||[];
const ST=['Submitted','Under Review','In Progress','Resolved','Closed'],ix=ST.indexOf(c.status),trk=ix<0?`<div class="end s-${c.status}">This concern was ${c.status.toLowerCase()}.</div>`:`<div class="track">${ST.map((x,i)=>`<div class="${i<ix?'done':i==ix?'done now':''}">${x}</div>`).join('')}</div>`;
const open_=!['Closed','Cancelled','Rejected'].includes(c.status),att=`<div class="card"><h3>Attachments</h3>${c.attachments.map(a=>`<div class="att">${a.mime.startsWith('image/')?`<a href="/api/attachments/${a.attachment_id}" target="_blank"><img src="/api/attachments/${a.attachment_id}" alt=""></a>`:'<span class="doc">📄</span>'}<div><a href="/api/attachments/${a.attachment_id}" target="_blank">${E(a.filename)}</a><div class="mut">${Math.max(1,Math.round(a.size/1024))} KB · ${E(a.uploader)}</div></div>${open_&&(a.uploaded_by===me.user_id||me.role==='admin')?`<button class="d" onclick="delAtt(${a.attachment_id})">Remove</button>`:''}</div>`).join('')||'<p class="mut">No files attached.</p>'}${open_?'<div class="row" style="margin-top:.6rem"><input id="af" type="file" multiple accept=".png,.jpg,.jpeg,.pdf,.doc,.docx,.txt"><button onclick="addAtt()">Upload</button></div><div class="err" id="ae"></div>':''}</div>`;
window._c=c;$('#app').innerHTML=`<button onclick="go('list')">← Back</button><div class="card" style="margin-top:.8rem">${trk}</div><div class="card"><h2>${E(c.subject)}</h2>
<p>${tag(c.status)} <span class="tag">${c.priority}</span> <span class="mut">${c.ref_no} · ${E(c.category)} → ${E(c.department)} · Assigned: ${E(c.assignee||'Unassigned')} · Student: ${E(c.student_name)}</span></p>
<p>${E(c.description)}</p><p class="${c.overdue?'od':'mut'}">Due ${c.due_at}${c.overdue?' — OVERDUE':''}</p>
${me.role==='student'&&c.status==='Submitted'?'<button onclick="newF(_c)">Edit</button>':''}</div>
${att}${acts.length?`<div class="card"><h3>Take action</h3><label>Remarks (required for Rejected / Resolved)</label><textarea id="rm" rows="2"></textarea><div class="err" id="er"></div>${acts.map(a=>`<button class="${/Reject|Cancel/.test(a)?'d':'p'}" onclick="act('${a}')">${a==='In Progress'&&c.status==='Resolved'?'Reopen':'Mark '+a}</button> `).join('')}</div>`:''}
${me.role==='admin'?`<div class="card"><h3>Re-route (admin)</h3><div class="row"><select id="rc">${meta.categories.map(x=>`<option value="${x.category_id}">${E(x.name)} → ${E(x.dept)}</option>`)}</select><button onclick="post('/concerns/${c.concern_id}/reroute',{category_id:$('#rc').value}).then(()=>go('detail',${c.concern_id}))">Re-route</button></div></div>`:''}
<div class="card"><h3>History</h3>${c.logs.map(l=>`<div class="log"><b>${l.from_status?l.from_status+' → ':''}${l.to_status}</b> <span class="mut">by ${E(l.actor)} · ${l.created_at}</span>${l.remarks?'<div>'+E(l.remarks)+'</div>':''}</div>`).join('')}</div>`}
const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
async function upl(id,files){for(const f of files){if(f.size>2097152)throw Error(f.name+' is larger than 2 MB');await post('/concerns/'+id+'/attachments',{filename:f.name,mime:f.type,data:await rd(f)})}}
async function addAtt(){try{await upl(_c.concern_id,$('#af').files);go('detail',_c.concern_id)}catch(e){$('#ae').textContent=e.message}}
async function delAtt(id){if(confirm('Remove this file?')){try{await api('/attachments/'+id,{m:'DELETE'});go('detail',_c.concern_id)}catch(e){alert(e.message)}}}
async function act(to){try{await post('/concerns/'+_c.concern_id+'/action',{to,remarks:$('#rm').value});go('detail',_c.concern_id)}catch(e){$('#er').textContent=e.message}}
async function users(){const u=await api('/admin/users');$('#app').innerHTML=`<h2>User management</h2><div class="card"><h3>Add account</h3><div class="row"><input id="un" placeholder="Full name"><input id="ue" placeholder="Email"><input id="up" type="password" placeholder="Password (8+)">
<select id="ur"><option>staff</option><option>admin</option><option>student</option></select><select id="ud">${meta.departments.map(d=>`<option value="${d.dept_id}">${E(d.name)}</option>`)}</select><button class="p" id="ua">Add</button></div><div class="err" id="er"></div></div>
<div class="card" style="overflow:auto"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Dept</th><th>Active</th></tr>${u.map(x=>`<tr><td>${E(x.full_name)}</td><td>${E(x.email)}</td><td>${x.role}</td><td>${E(x.dept||'')}</td><td><button onclick="post('/admin/users/${x.user_id}/toggle').then(users).catch(e=>alert(e.message))">${x.is_active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</table></div>`;
$('#ua').onclick=async()=>{try{await post('/admin/users',{full_name:$('#un').value,email:$('#ue').value,password:$('#up').value,role:$('#ur').value,dept_id:$('#ud').value});users()}catch(e){$('#er').textContent=e.message}}}
async function cats(){meta=await api('/meta');$('#app').innerHTML=`<h2>Routing rules</h2><div class="card"><p class="mut">Each category routes automatically to one department.</p><div class="row"><input id="cn" placeholder="New category"><select id="cd">${meta.departments.map(d=>`<option value="${d.dept_id}">${E(d.name)}</option>`)}</select><button class="p" id="ca">Add</button></div><div class="err" id="er"></div></div>
<div class="card"><table><tr><th>Category</th><th>Routed to</th></tr>${meta.categories.map(c=>`<tr><td>${E(c.name)}</td><td>${E(c.dept)}</td></tr>`).join('')}</table></div>`;
$('#ca').onclick=async()=>{try{await post('/admin/categories',{name:$('#cn').value,dept_id:$('#cd').value});cats()}catch(e){$('#er').textContent=e.message}}}
function notifV(n){post('/notifications/read');$('#app').innerHTML=`<h2>Notifications</h2><div class="card">${n.map(x=>`<div class="log" style="${x.is_read?'':'border-color:var(--acc)'}">${E(x.message)} <span class="mut">${x.created_at}</span> ${x.concern_id?`<a href="#" onclick="go('detail',${x.concern_id});return false">open</a>`:''}</div>`).join('')||'<p class="mut">Nothing yet.</p>'}</div>`}
boot();
</script></body></html>
